# /etc/systemd/system/desktop-session.service.d/mobilegl.conf - the image's desktop-session.service
# (User=<desktop user>, PAMName=login, enabled in multi-user.target) as the MobileGL flavour's
# Plasma session. Installed by sync-build-kwin.sh, which also enables the unit.
#
# Like the original image the container boots straight into this session, and the Anland app
# brings the container up when it opens. The session only proceeds once the app's MobileGL server
# listens and the display daemon's socket exists (mobilegl-startup.sh wait), takes the backend the
# app's server runs (sync-backend, as root), and comes back whenever it ends.
[Service]
ExecStartPre=/opt/mobilegl/bin/mobilegl-startup.sh wait
ExecStartPre=+/opt/mobilegl/bin/mobilegl-startup.sh sync-backend
ExecStart=
ExecStart=/opt/mobilegl/bin/mobilegl-startup.sh plasma
Environment=QT_LOGGING_RULES=kwin_*.info=true
Restart=always
RestartSec=5s
# The wait has no deadline: the container may be up long before anyone opens the app.
TimeoutStartSec=infinity
