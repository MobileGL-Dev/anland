plugins {
    id 'com.android.application'
}

// The Android split build is part of Anland's distribution. Supply its native
// output directory with -PmobileglDist=... or MOBILEGL_DIST; no plugin APK or
// external Android application is used at runtime.
def mobileglDistPath = providers.gradleProperty('mobileglDist')
        .orElse(providers.environmentVariable('MOBILEGL_DIST')).orNull
def mobileglDist = mobileglDistPath == null ? null : file(mobileglDistPath)
def mobileglLibs = layout.buildDirectory.dir('generated/mobilegl/jniLibs')
def stageMobileGL = tasks.register('stageMobileGL') {
    inputs.property('mobileglDistribution', mobileglDistPath ?: '')
    if (mobileglDist != null) {
        inputs.files(fileTree(mobileglDist) { include '*.so', 'arm64-v8a/*.so' })
    }
    outputs.dir(mobileglLibs)
    doLast {
        if (mobileglDist == null) {
            // A no-source Sync task is skipped by Gradle. Clear explicitly when
            // returning to an unbundled build so old binaries cannot survive.
            project.delete(mobileglLibs.get().asFile)
            project.mkdir(mobileglLibs.get().asFile)
        } else {
            // Only the split client library is needed: the renderer ABI it
            // exports (EmbeddedServer.h) is served in-process by the :mobilegl
            // service, so no separately exec'd supervisor binary is staged.
            ['libMobileGL.so'].each { library ->
                if (!new File(mobileglDist, library).isFile() &&
                        !new File(mobileglDist, 'arm64-v8a/' + library).isFile())
                    throw new GradleException("MOBILEGL_DIST is missing ${library}: ${mobileglDist}")
            }
            project.sync { spec ->
                spec.from(mobileglDist)
                spec.from(new File(mobileglDist, 'arm64-v8a'))
                spec.include('*.so')
                spec.into(mobileglLibs.get().dir('arm64-v8a').asFile)
            }
        }
    }
}

// Run a git command at configuration time, returning its trimmed stdout or a
// fallback when git isn't available (e.g. building from an exported tarball).
def gitOutput = { List<String> cmd, String fallback ->
    try {
        def stdout = new ByteArrayOutputStream()
        def result = exec {
            commandLine cmd
            standardOutput = stdout
            ignoreExitValue = true
        }
        if (result.exitValue != 0) return fallback
        def out = stdout.toString().trim()
        return out.isEmpty() ? fallback : out
    } catch (Exception ignored) {
        return fallback
    }
}

// Short commit id of the source tree the APK was built from.
def gitCommitId = gitOutput(['git', 'rev-parse', '--short', 'HEAD'], "unknown")
// Branch the APK was built from, so a build of the Gold branch says so in its
// version rather than carrying a commit id nobody can place. Empty on a
// detached HEAD -- which is what CI checks out -- so that case falls back to
// the commit id, which is still the right answer there.
def gitBranch = gitOutput(['git', 'branch', '--show-current'], "")
def gitBuildId = gitBranch.isEmpty() ? gitCommitId : gitBranch
// Most recent tag reachable from HEAD (e.g. "5.20"), used as the versionName
// prefix so it tracks releases instead of a hardcoded number.
def gitTag = gitOutput(['git', 'describe', '--tags', '--abbrev=0'], "unknown")
// Number of commits reachable from HEAD, used as a monotonic versionCode.
def gitCommitCount = gitOutput(['git', 'rev-list', '--count', 'HEAD'], "1") as Integer
// "-dirty" when the working tree has uncommitted changes at build time.
def gitDirty = gitOutput(['git', 'status', '--porcelain'], "").isEmpty() ? "" : "-dirty"

android {
    namespace 'com.anland.consumer'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId providers.gradleProperty('mobileglApplicationId').getOrElse('com.anland.consumer')
        minSdk 30
        targetSdk 36
        versionCode gitCommitCount
        versionName "${gitTag}-${gitBuildId}${gitDirty}"
        buildConfigField 'boolean', 'MOBILEGL_BUNDLED', mobileglDist != null ? 'true' : 'false'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    // Two variants of the same app: plain (no Tracy client, lean) and tracy
    // (Tracy client + INTERNET permission overlay in src/tracy/ so the client
    // can listen on TCP 8086). Each flavor drives the ANLAND_TRACY CMake option.
    flavorDimensions "tracy"
    productFlavors {
        plain {
            dimension "tracy"
            externalNativeBuild {
                cmake {
                    arguments "-DANLAND_TRACY=OFF"
                }
            }
        }
        tracy {
            dimension "tracy"
            externalNativeBuild {
                cmake {
                    arguments "-DANLAND_TRACY=ON"
                }
            }
        }
    }

    ndkVersion providers.gradleProperty('anlandNdkVersion')
            .orElse(providers.environmentVariable('ANLAND_NDK_VERSION'))
            .getOrElse('29.0.13113456')

    sourceSets.main.jniLibs.srcDir(mobileglLibs)

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // Extract native libs onto disk so the bundled root helper (libfdhelper.so)
    // is a real executable file that `su -c` can run from nativeLibraryDir.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

tasks.named('preBuild').configure { dependsOn(stageMobileGL) }

dependencies {
    // The pure-logic pieces (Gold status parsing, node selection, source
    // fallback, the key ledgers) are deliberately Android-free so they can be
    // tested on the JVM without Robolectric.
    testImplementation 'junit:junit:4.13.2'
}
